name: Build Divergent Branch

on:
  push:
    branches: ["divergent"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  divergent-build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate Frontend Static Assets
        shell: bash
        run: |
          make frontend-install-dependencies
          make frontend-build

      - name: Verify Generated Static Assets Exist
        shell: bash
        run: |
          echo "== git status =="
          git status --porcelain || true
          echo
          echo "== web/static (top) =="
          ls -la web/static | head -n 200 || true
          echo
          echo "== web/static files sample =="
          find web/static -maxdepth 3 -type f | head -n 50 || true

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In To GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=divergent
            type=raw,value=divergent-${{ github.run_number }}

      - name: Build And Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}